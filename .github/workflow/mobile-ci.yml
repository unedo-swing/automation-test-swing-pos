name: Mobile Automation CI (Android + iOS)

on:
  push:
    branches: [ main, master, dev ]
  pull_request:

env:
  REPO_URL: https://github.com/unedo-swing/automation-test-swing-pos
  PYTHON_VERSION: "3.11"

jobs:

  # ============================
  # ANDROID JOB
  # ============================
  android-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install

      - name: Install Appium + Driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Start Appium Server
        run: |
          appium --base-path /wd/hub &
          sleep 8

      - name: Start Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          script: |
            adb install app/MyAppAndroid.apk
            echo "Running Android Tests..."
            pytest -m android -s --disable-warnings --maxfail=1


  # ============================
  # IOS JOB
  # ============================
  ios-tests:
    runs-on: macos-14
    timeout-minutes: 60
    needs: []   # run parallel

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install

      - name: Install Appium + XCUITest Driver
        run: |
          npm install -g appium
          appium driver install xcuitest

      - name: Start Appium Server
        run: |
          appium --base-path /wd/hub &
          sleep 8

      - name: Boot iOS Simulator
        run: |
          xcrun simctl boot "iPhone 15"
          xcrun simctl bootstatus "iPhone 15" -b
          sleep 5

      - name: Install iOS App
        run: |
          xcrun simctl install "iPhone 15" app/MyAppiOS.app

      - name: Run iOS Tests
        run: |
          pytest -m ios -s --disable-warnings --maxfail=1
